<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Projects</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }

    .projects-container {
      max-width: 900px;
      width: 100%;
    }

    .project {
      display: flex;
      border-bottom: 1px solid #ddd;
      padding: 2rem 0;
      gap: 2rem;
    }

    .project-title {
      flex: 1;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .project-details {
      flex: 2;
    }

    .project-details p {
      margin: 0 0 0.5rem;
      color: #555;
    }

    .project-details a {
      color: #0070f3;
      text-decoration: none;
      font-weight: bold;
    }

    .project-details a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="projects-container">
    <div class="project">
      <div class="project-title">
        Refactoring UI
      </div>
      <div class="project-details">
        <p>A book and video series that teaches you how to design beautiful user interfaces, without relying on gut feeling or arbitrary rules.</p>
        <a href="https://refactoringui.com/" target="_blank">Read more →</a>
      </div>
    </div>

    <div class="project">
      <div class="project-title">
        Heroicons
      </div>
      <div class="project-details">
        <p>A free, MIT-licensed set of high-quality SVG icons for you to use in your web projects.</p>
        <a href="https://heroicons.com/" target="_blank">Read more →</a>
      </div>
    </div>

    <!-- Add more projects here -->
  </div>

</body>
</html>
